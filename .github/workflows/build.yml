name: Build

on:
  push:
    branches:
      - 'feat/**'
      - 'fix/**'
      - '1.20.1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Forge & Fabric
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Prepare build scripts
        run: |
          set -euo pipefail
          base=https://raw.githubusercontent.com/Fuzss/modresources/main/gradle/v1
          curl -fsSL "$base/fabric.gradle" -o Fabric/fabric.gradle
          curl -fsSL "$base/forge.gradle" -o Forge/forge.gradle
          # the shared version catalog registers CurseGradle under its new plugin id
          sed -i 's/io\.github\.CDAGaming\.cursegradle/me.hypherionmc.cursegradle/g' Fabric/fabric.gradle Forge/forge.gradle
          sed -i "s#apply from: '$base/fabric.gradle'#apply from: 'fabric.gradle'#" Fabric/build.gradle
          sed -i "s#apply from: '$base/forge.gradle'#apply from: 'forge.gradle'#" Forge/build.gradle
          grep -n "apply from" Fabric/build.gradle Forge/build.gradle
          grep -n "cursegradle" Fabric/fabric.gradle Forge/forge.gradle

      - name: Build Forge and Fabric jars
        run: ./gradlew allBuild --stacktrace --no-daemon

      - name: List built jars
        run: |
          ls -l Forge/build/libs
          ls -l Fabric/build/libs

      - name: Upload mod jars
        uses: actions/upload-artifact@v4
        with:
          name: enchanting-infuser-1.20.1
          path: |
            Forge/build/libs/*.jar
            Fabric/build/libs/*.jar
            !**/*-sources.jar
            !**/*-javadoc.jar
            !**/*-dev.jar
          if-no-files-found: error
          retention-days: 14
