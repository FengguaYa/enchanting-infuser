name: Build

on:
  push:
    branches:
      - 'feat/**'
      - 'fix/**'
      - '1.20.1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Forge & Fabric
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Forge and Fabric jars
        run: ./gradlew allBuild --stacktrace --no-daemon

      - name: List built jars
        run: |
          ls -l Forge/build/libs
          ls -l Fabric/build/libs

      - name: Upload mod jars
        uses: actions/upload-artifact@v4
        with:
          name: enchanting-infuser-1.20.1
          path: |
            Forge/build/libs/*.jar
            Fabric/build/libs/*.jar
            !**/*-sources.jar
            !**/*-javadoc.jar
            !**/*-dev.jar
          if-no-files-found: error
          retention-days: 14
